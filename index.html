<!DOCTYPE html>
<html lang="en" class="dark scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#020617" />
  <meta
    name="description"
    content="Aagun Labs — Deep-tech product studio architecting high-demand digital products, enterprise software engines, SaaS systems, and secure web blueprints."
  />
  <meta name="author" content="Safi Saleh Bhuiyan — Aagun Labs" />
  <title>Aagun Labs — Digital Products & Enterprise Software Engines</title>

  <!-- Premium typography -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <script>
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          fontFamily: {
            sans: ["Inter", "sans-serif"],
            display: ["Space Grotesk", "sans-serif"],
            mono: ["DM Mono", "monospace"],
          },
          colors: {
            radium: "#00ff7f",
            voltage: "#00f2fe",
            flame: "#f97316",
            neonpink: "#ff2bd6",
          },
          boxShadow: {
            neon:
              "0 0 25px rgba(0,255,127,.25), 0 0 70px rgba(0,242,254,.14)",
            cyan:
              "0 0 25px rgba(0,242,254,.28), 0 0 80px rgba(0,242,254,.12)",
            pink:
              "0 0 25px rgba(255,43,214,.25), 0 0 80px rgba(255,43,214,.12)",
            orange:
              "0 0 25px rgba(249,115,22,.25), 0 0 80px rgba(249,115,22,.12)",
          },
          animation: {
            float: "float 8s ease-in-out infinite",
            floatSlow: "floatSlow 13s ease-in-out infinite",
            breathe: "breathe 6s ease-in-out infinite",
            pulseGlow: "pulseGlow 3s ease-in-out infinite",
            shimmer: "shimmer 3s linear infinite",
            scan: "scan 4s linear infinite",
            drift: "drift 18s linear infinite",
            spinSlow: "spinSlow 22s linear infinite",
            blink: "blink 1.8s ease-in-out infinite",
          },
          keyframes: {
            float: {
              "0%, 100%": { transform: "translate3d(0,0,0)" },
              "50%": { transform: "translate3d(0,-20px,0)" },
            },
            floatSlow: {
              "0%, 100%": { transform: "translate3d(0,0,0) scale(1)" },
              "50%": { transform: "translate3d(30px,-35px,0) scale(1.06)" },
            },
            breathe: {
              "0%, 100%": {
                opacity: ".32",
                transform: "scale(.94)",
              },
              "50%": {
                opacity: ".72",
                transform: "scale(1.08)",
              },
            },
            pulseGlow: {
              "0%, 100%": {
                opacity: ".55",
                boxShadow: "0 0 8px rgba(0,255,127,.35)",
              },
              "50%": {
                opacity: "1",
                boxShadow:
                  "0 0 12px rgba(0,255,127,.8), 0 0 35px rgba(0,255,127,.35)",
              },
            },
            shimmer: {
              "0%": { transform: "translateX(-120%)" },
              "100%": { transform: "translateX(120%)" },
            },
            scan: {
              "0%": { transform: "translateY(-120%)" },
              "100%": { transform: "translateY(500%)" },
            },
            drift: {
              "0%": { transform: "translateX(-20%) rotate(0deg)" },
              "50%": { transform: "translateX(20%) rotate(180deg)" },
              "100%": { transform: "translateX(-20%) rotate(360deg)" },
            },
            spinSlow: {
              from: { transform: "rotate(0deg)" },
              to: { transform: "rotate(360deg)" },
            },
            blink: {
              "0%, 100%": { opacity: ".35" },
              "50%": { opacity: "1" },
            },
          },
        },
      },
    };
  </script>

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      color-scheme: dark;

      --bg: #020617;
      --bg-secondary: #050b17;
      --text: #f8fafc;
      --muted: #94a3b8;
      --panel: rgba(7, 14, 28, 0.68);
      --panel-strong: rgba(5, 10, 21, 0.86);
      --border: rgba(255, 255, 255, 0.1);
      --border-strong: rgba(255, 255, 255, 0.16);
      --grid: rgba(148, 163, 184, 0.065);
    }

    html.light {
      color-scheme: light;

      --bg: #eef3f8;
      --bg-secondary: #ffffff;
      --text: #08111f;
      --muted: #536274;
      --panel: rgba(255, 255, 255, 0.74);
      --panel-strong: rgba(255, 255, 255, 0.9);
      --border: rgba(15, 23, 42, 0.12);
      --border-strong: rgba(15, 23, 42, 0.2);
      --grid: rgba(15, 23, 42, 0.06);
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      background: var(--bg);
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      background:
        radial-gradient(circle at 15% 10%, rgba(0, 255, 127, 0.055), transparent 25%),
        radial-gradient(circle at 85% 15%, rgba(0, 242, 254, 0.06), transparent 25%),
        radial-gradient(circle at 50% 80%, rgba(255, 43, 214, 0.035), transparent 28%),
        var(--bg);
      color: var(--text);
      font-family: "Inter", sans-serif;
      transition:
        background 0.7s ease,
        color 0.5s ease;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      opacity: 0.18;
      background-image:
        linear-gradient(var(--grid) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid) 1px, transparent 1px);
      background-size: 80px 80px;
      mask-image: linear-gradient(to bottom, black, transparent 88%);
    }

    body::after {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9997;
      opacity: 0.035;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.6'/%3E%3C/svg%3E");
      mix-blend-mode: overlay;
    }

    ::selection {
      background: rgba(0, 255, 127, 0.25);
      color: white;
    }

    .font-display {
      font-family: "Space Grotesk", sans-serif;
    }

    .font-mono {
      font-family: "DM Mono", monospace;
    }

    .ambient {
      position: fixed;
      pointer-events: none;
      z-index: 0;
      border-radius: 9999px;
      filter: blur(90px);
      mix-blend-mode: screen;
    }

    html.light .ambient {
      mix-blend-mode: multiply;
      opacity: 0.25;
      filter: blur(110px);
    }

    .ambient-emerald {
      width: 420px;
      height: 420px;
      left: -180px;
      top: 10%;
      background: #00ff7f;
      opacity: 0.18;
      animation: floatSlow 15s ease-in-out infinite;
    }

    .ambient-cyan {
      width: 520px;
      height: 520px;
      right: -240px;
      top: 12%;
      background: #00f2fe;
      opacity: 0.15;
      animation: floatSlow 18s ease-in-out infinite reverse;
    }

    .ambient-orange {
      width: 360px;
      height: 360px;
      left: 28%;
      top: 47%;
      background: #f97316;
      opacity: 0.09;
      animation: breathe 11s ease-in-out infinite;
    }

    .ambient-pink {
      width: 440px;
      height: 440px;
      right: 14%;
      bottom: 8%;
      background: #ff2bd6;
      opacity: 0.08;
      animation: floatSlow 17s ease-in-out infinite;
    }

    .glass {
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.075),
          rgba(255, 255, 255, 0.025) 38%,
          rgba(0, 0, 0, 0.05)
        );
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      transition:
        background 0.5s ease,
        border-color 0.5s ease;
    }

    html.light .glass {
      background:
        linear-gradient(
          145deg,
          rgba(255, 255, 255, 0.4),
          rgba(255, 255, 255, 0.15) 65%
        );
    }

    .glass-thick {
      background: var(--panel);
      border: 1px solid var(--border-strong);
    }

    html.light .glass-thick {
      background: var(--panel-strong);
    }
  </style>
</head>
<body>
  <!-- Ambient glows -->
  <div class="ambient ambient-emerald"></div>
  <div class="ambient ambient-cyan"></div>
  <div class="ambient ambient-orange"></div>
  <div class="ambient ambient-pink"></div>

  <div class="relative z-10 min-height-screen flex flex-col justify-between">
    <!-- NAVIGATION -->
    <header class="w-full px-4 pt-6 sm:px-6 lg:px-8 max-w-7xl mx-auto z-50">
      <nav class="glass rounded-2xl px-6 py-4 flex items-center justify-between shadow-sm">
        <div class="flex items-center gap-2.5">
          <div class="relative flex h-3 w-3">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-radium opacity-75"></span>
            <span class="relative inline-flex rounded-full h-3 w-3 bg-radium"></span>
          </div>
          <span class="font-display font-bold tracking-tight text-lg text-white">Aagun Labs</span>
        </div>
        <div class="hidden md:flex items-center gap-8 text-sm font-medium">
          <a href="#portfolio" class="hover:text-white transition">Portfolio</a>
          <a href="#services" class="hover:text-white transition">Capabilities</a>
